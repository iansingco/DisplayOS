<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>DisplayOS Setup</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0a0a0f; color: #c8c8e8; font-family: 'Courier New', monospace; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; }
.wrap { width: 100%; max-width: 520px; }
h1 { font-size: 1rem; letter-spacing: .2em; color: #7faaff; margin-bottom: 2rem; font-weight: normal; }
label { font-size: .7rem; opacity: .5; letter-spacing: .15em; display: block; margin-bottom: .4rem; text-transform: uppercase; }
input, select { width: 100%; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12); border-radius: 6px; color: #e0e0ff; padding: .6rem .8rem; font-size: .9rem; font-family: inherit; outline: none; margin-bottom: 1.25rem; }
button { width: 100%; padding: .65rem; background: rgba(127,255,127,.1); border: 1px solid rgba(127,255,127,.3); border-radius: 6px; color: #7fff7f; cursor: pointer; font-family: inherit; font-size: .9rem; margin-bottom: .75rem; }
button:hover { background: rgba(127,255,127,.18); }
.btn-sec { background: rgba(127,170,255,.08); border-color: rgba(127,170,255,.2); color: #7faaff; }
.hint { font-size: .7rem; opacity: .4; margin-top: -.9rem; margin-bottom: 1.25rem; }
.status { font-size: .75rem; padding: .5rem .75rem; border-radius: 6px; margin-top: 1rem; display: none; }
.ok  { background: rgba(127,255,127,.08); border: 1px solid rgba(127,255,127,.2); color: #7fff7f; }
.err { background: rgba(255,100,100,.08); border: 1px solid rgba(255,100,100,.2); color: #ff9f9f; }
.divider { border: none; border-top: 1px solid rgba(255,255,255,.07); margin: 1.5rem 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>◈ DisplayOS — Quick Setup</h1>

  <label>Paste a URL to display</label>
  <input id="url" type="text" placeholder="https://... (image, GIF, or website)" autofocus />
  <div class="hint" id="detect"></div>

  <label>Screen</label>
  <select id="screen"><option value="main">main</option></select>

  <button onclick="apply()">Show on Display</button>
  <button class="btn-sec" type="button" onclick="openDisplay()">↗ Open Display</button>

  <hr class="divider">

  <label>Upload a video or image from your PC</label>
  <div id="dropzone" style="border:1px dashed rgba(255,255,255,.15);border-radius:6px;padding:1.5rem;text-align:center;cursor:pointer;font-size:.75rem;opacity:.5;margin-bottom:.5rem;transition:opacity .2s" onclick="document.getElementById('fileinput').click()" ondragover="event.preventDefault();this.style.opacity=1" ondragleave="this.style.opacity=.5" ondrop="handleDrop(event)">
    Drop video / image here, or click to browse
  </div>
  <input id="fileinput" type="file" accept="video/*,image/*,.gif" style="display:none" onchange="uploadFile(this.files[0])">
  <div id="media-list" style="display:flex;flex-direction:column;gap:.4rem;margin-bottom:1rem"></div>

  <hr class="divider">

  <label>Or add individual widgets</label>
  <div style="display:flex;gap:.5rem;flex-wrap:wrap" id="palette"></div>

  <hr class="divider">

  <a href="http://localhost:5174" target="_blank"><button class="btn-sec" type="button" style="opacity:.6">⚙ Admin Panel (localhost:5174)</button></a>

  <div class="status" id="status"></div>
</div>

<script>
function normalizeUrl(url) {
  if (!url) return url;
  try {
    const u = new URL(url);
    const isYT = u.hostname === 'www.youtube.com' || u.hostname === 'youtube.com' || u.hostname === 'youtu.be';
    if (isYT && !url.includes('pie.yt')) {
      return `https://pie.yt/?v=${encodeURIComponent(url)}&pieshare=1`;
    }
    if (u.hostname === 'www.twitch.tv' || u.hostname === 'twitch.tv') {
      const parts = u.pathname.split('/').filter(Boolean);
      if (parts.length === 1) return `https://player.twitch.tv/?channel=${parts[0]}&parent=${location.hostname}&autoplay=true`;
      if (parts[0] === 'videos' && parts[1]) return `https://player.twitch.tv/?video=${parts[1]}&parent=${location.hostname}&autoplay=true`;
    }
    if (u.hostname === 'open.spotify.com') {
      return url.replace('open.spotify.com/', 'open.spotify.com/embed/');
    }
  } catch {}
  return url;
}

const TYPES = [
  { type:'clock',   label:'🕐 Clock',   config:{} },
  { type:'weather', label:'⛅ Weather', config:{ city:'New York' } },
  { type:'stats',   label:'📊 Stats',   config:{} },
];

// ── Media library ─────────────────────────────────────────────────────────────
function loadMedia() {
  fetch('/api/media').then(r=>r.json()).then(files => {
    const el = document.getElementById('media-list');
    if (!files.length) { el.innerHTML = '<div style="font-size:.65rem;opacity:.3;text-align:center">No uploads yet</div>'; return; }
    el.innerHTML = files.map(f => {
      const isVideo = /\.(mp4|webm|mov|mkv)$/i.test(f.name);
      const icon = isVideo ? '▶' : '◼';
      return `<div style="display:flex;align-items:center;gap:.5rem;padding:.4rem .6rem;background:rgba(255,255,255,.03);border-radius:4px;font-size:.7rem">
        <span style="opacity:.4">${icon}</span>
        <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${f.name}</span>
        <button onclick="useMedia('${f.url}','${f.name}')" style="width:auto;padding:.2rem .5rem;font-size:.65rem;background:rgba(127,255,127,.1);border:1px solid rgba(127,255,127,.2);color:#7fff7f;border-radius:4px;cursor:pointer;margin:0">Use</button>
        <button onclick="deleteMedia('${f.name}')" style="width:auto;padding:.2rem .5rem;font-size:.65rem;background:rgba(255,100,100,.07);border:1px solid rgba(255,100,100,.15);color:#ff9f9f;border-radius:4px;cursor:pointer;margin:0">✕</button>
      </div>`;
    }).join('');
  });
}

async function uploadFile(file) {
  if (!file) return;
  const dz = document.getElementById('dropzone');
  dz.textContent = `Uploading ${file.name}…`;
  dz.style.opacity = 1;
  const fd = new FormData();
  fd.append('file', file);
  const res = await fetch('/api/upload', { method:'POST', body: fd });
  if (res.ok) {
    const data = await res.json();
    dz.textContent = 'Drop video / image here, or click to browse';
    dz.style.opacity = .5;
    loadMedia();
    showStatus(`Uploaded: ${data.name}`, true);
  } else {
    dz.textContent = 'Upload failed — try again';
    showStatus('Upload failed', false);
  }
}

function handleDrop(e) {
  e.preventDefault();
  document.getElementById('dropzone').style.opacity = .5;
  const file = e.dataTransfer.files[0];
  if (file) uploadFile(file);
}

async function useMedia(url, name) {
  const screenId = document.getElementById('screen').value;
  const isVideo = /\.(mp4|webm|mov|mkv)$/i.test(name);
  const type = isVideo ? 'video' : 'gif';
  await clearScreen(screenId);
  await addWidget(type, { url }, screenId, [0,0,12,8]);
  showStatus(`Now showing: ${name}`, true);
}

async function deleteMedia(name) {
  await fetch(`/api/media/${encodeURIComponent(name)}`, { method:'DELETE' });
  loadMedia();
}

loadMedia();

// Populate screen selector
fetch('/api/screens').then(r=>r.json()).then(screens => {
  const sel = document.getElementById('screen');
  sel.innerHTML = '';
  Object.values(screens).forEach(s => {
    const o = document.createElement('option');
    o.value = s.id; o.textContent = `${s.name} (/${s.id})`;
    sel.appendChild(o);
  });
});

// Widget palette
const pal = document.getElementById('palette');
TYPES.forEach(t => {
  const b = document.createElement('button');
  b.textContent = t.label;
  b.style.cssText = 'width:auto;padding:.4rem .75rem;font-size:.75rem;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);color:#c8c8e8;margin-bottom:.5rem';
  b.onclick = () => addWidget(t.type, t.config);
  pal.appendChild(b);
});

// Auto-detect type from URL
document.getElementById('url').addEventListener('input', function() {
  const u = this.value.toLowerCase().split('?')[0].trim();
  const hint = document.getElementById('detect');
  if (!u) { hint.textContent = ''; return; }
  if (/\.(gif|png|jpg|jpeg|webp|svg)$/.test(u) || /giphy|tenor|gfycat/.test(u))
    hint.textContent = 'Detected: Image / GIF → will display full screen';
  else if (/youtube\.com|youtu\.be/.test(u))
    hint.textContent = 'Detected: YouTube → will proxy via pie.yt (no ads, embeddable)';
  else if (/twitch\.tv/.test(u))
    hint.textContent = 'Detected: Twitch → will convert to embed player';
  else if (/open\.spotify\.com/.test(u))
    hint.textContent = 'Detected: Spotify → will convert to embed player';
  else if (u.startsWith('http') || u.includes('.'))
    hint.textContent = 'Detected: Website → will embed as iframe (note: many sites block this)';
  else
    hint.textContent = '';
});

function ensureHttps(url) {
  url = url.trim();
  if (!url) return url;
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
  return url;
}

async function apply() {
  const raw = ensureHttps(document.getElementById('url').value.trim());
  if (!raw) return;
  const url = normalizeUrl(raw);
  const screenId = document.getElementById('screen').value;
  const u = raw.toLowerCase().split('?')[0];
  const isImg = /\.(gif|png|jpg|jpeg|webp|svg)$/.test(u) || /giphy|tenor|gfycat/.test(u);
  const type = isImg ? 'gif' : 'iframe';
  const config = isImg ? { url, objectFit:'cover' } : { url, label:'' };
  await clearScreen(screenId);
  await addWidget(type, config, screenId, [0,0,12,8]);
  showStatus('Done! Display updated.', true);
}

async function clearScreen(screenId) {
  const r = await fetch(`/api/screens/${screenId}`).then(r=>r.json());
  for (const w of r.widgets||[]) {
    await fetch(`/api/screens/${screenId}/widgets/${w.id}`, { method:'DELETE' });
  }
}

async function addWidget(type, config, screenId, pos) {
  screenId = screenId || document.getElementById('screen').value;
  pos = pos || [0,0,6,4];
  const res = await fetch(`/api/screens/${screenId}/widgets`, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ type, x:pos[0], y:pos[1], w:pos[2], h:pos[3], config })
  });
  if (res.ok) showStatus(`Added ${type} widget.`, true);
  else        showStatus('Error adding widget.', false);
}

function openDisplay() {
  const screenId = document.getElementById('screen').value;
  window.open(`/view?screen=${encodeURIComponent(screenId)}`, '_blank');
}

function showStatus(msg, ok) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status ' + (ok ? 'ok' : 'err');
  el.style.display = 'block';
  setTimeout(() => el.style.display='none', 3000);
}
</script>
</body>
</html>
